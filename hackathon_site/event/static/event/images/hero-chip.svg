<style>
  .pulse {
    stroke: #8ff3ed;
    stroke-width: 2.6;
    fill: none;
    stroke-linecap: round;
    stroke-dasharray: 12 112;
    stroke-dashoffset: 12;
    opacity: 0;
    filter: url(#glow);
    animation: travel 4.6665s linear infinite;
  }
  @keyframes travel {
    0%   { stroke-dashoffset: 12; opacity: 0; }
    8%   { opacity: 0.8; }
    78%  { opacity: 0.8; }
    88%  { stroke-dashoffset: -100; opacity: 0; }
    100% { stroke-dashoffset: -100; opacity: 0; }
  }
  .d1 { animation-delay: -1s; animation-duration: 4.6665s; }
  .d2 { animation-delay: -3.5s; animation-duration: 5.335s; }
  .d3 { animation-delay: -5.5s; animation-duration: 5s; }
