  .d8 { animation-delay: -7.5s; animation-duration: 5.335s; }
  .d9 { animation-delay: -1.5s; animation-duration: 6.335s; }
  @media (prefers-reduced-motion: reduce) {
    .pulse { animation: none; opacity: 0; }
  }
</style>

